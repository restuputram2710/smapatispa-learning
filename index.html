  <script>
    /* Identitas aplikasi dari kunjungan terakhir → layar pembuka langsung bermerek tanpa menunggu server. */
    (function () {
      try { window.__CFG__ = JSON.parse(localStorage.getItem('sp_cfg') || 'null') || {}; } catch (e) { window.__CFG__ = {}; }
      try {
        var t = localStorage.getItem('sp_theme');
        if (t === 'dark' || t === '"dark"') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    })();
    /* Pemeriksa pemuatan: bila ada file yang tidak termuat (mis. salah struktur folder di GitHub), tampilkan penyebabnya. */
    window.__SP_ERR__ = [];
    window.addEventListener('error', function (e) { if (e && e.message) window.__SP_ERR__.push(e.message + (e.filename ? ' — ' + e.filename.split('/').slice(-2).join('/') : '') + (e.lineno ? ':' + e.lineno : '')); });
    (function () {
      var shown = false, need = ['config', 'core', 'shell', 'siswa', 'guru', 'umum', 'admin', 'main'];
      function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
      /** Panel pesan di atas layar pembuka (gaya inline → tetap terbaca walau style.css gagal dimuat). */
      window.spPanel = function (title, body) {
        var s = document.getElementById('splash'); if (!s || shown) return; shown = true;
        s.classList.remove('hide'); s.hidden = false;
        s.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:auto;background:linear-gradient(160deg,#3B82F6,#1D4ED8 50%,#0B1F7A)';
        var er = window.__SP_ERR__.length ? '<div style="margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.28);font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;word-break:break-word">' + window.__SP_ERR__.slice(0, 5).map(esc).join('<br>') + '</div>' : '';
        s.innerHTML = '<div style="max-width:480px;padding:24px;text-align:left;color:#fff;font:15px/1.6 Inter,system-ui,sans-serif"><div style="font-size:21px;font-weight:700;margin-bottom:8px">' + title + '</div>' + body + er + '</div>';
      };
      /** Periksa kelengkapan file (dipanggil main.js sebelum aplikasi dimulai, dan cadangan 5 detik). */
      window.spCheckFiles = function (skipMain) {
        var f = window.__SP_F__ || {}, miss = need.filter(function (n) { return !f[n] && !(skipMain && n === 'main'); });
        var cssOk = getComputedStyle(document.documentElement).getPropertyValue('--sp-css').trim() === '1';
        var fix = '<p style="margin-top:10px">Di repository GitHub harus ada <b>index.html</b> di paling atas, folder <b>css/</b> berisi style.css, dan folder <b>js/</b> berisi 8 file: config, core, shell, siswa, guru, umum, admin, main. Unggah ulang lewat terminal (git add . → git commit → git push), bukan lewat tombol "Upload files".</p>';
        if (!cssOk) { window.spPanel('File css/style.css tidak ditemukan', '<p>Tampilan aplikasi tidak dapat dimuat.</p>' + fix); return false; }
        if (miss.length) { window.spPanel('File JavaScript tidak lengkap', '<p>File yang hilang/rusak: <b>' + miss.map(function (n) { return 'js/' + n + '.js'; }).join(', ') + '</b>.</p>' + fix); return false; }
        return true;
      };
      setTimeout(function () {
        var s = document.getElementById('splash'); if (!s || s.classList.contains('hide')) return;
        if (window.spCheckFiles() && window.__SP_ERR__.length) window.spPanel('Aplikasi gagal dimulai', '<p>Terjadi kesalahan saat memulai aplikasi. Kirimkan tangkapan layar ini ke pengembang.</p>');
      }, 5000);
      setTimeout(function () { var s = document.getElementById('splash'); if (s && !s.classList.contains('hide')) window.spPanel('Server lambat merespons', '<p>Aplikasi sudah termuat, tetapi server Google belum menjawab. Periksa koneksi internet lalu muat ulang halaman.</p>'); }, 40000);
    })();
  </script>
